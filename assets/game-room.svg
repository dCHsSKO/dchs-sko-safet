<!-- stove --> <rect x="900" y="360" width="300" height="350" rx="20" fill="url(#stove)" filter="url(#shadow)"/><rect x="925" y="395" width="250" height="70" rx="12" fill="#0d151d"/><circle cx="970" cy="430" r="16" fill="#cbd5dc"/><circle cx="1045" cy="430" r="16" fill="#cbd5dc"/><circle cx="1120" cy="430" r="16" fill="#cbd5dc"/><rect x="945" y="485" width="210" height="180" rx="12" fill="#10171e"/><path d="M1035 630q45-80 90 0" fill="none" stroke="#ffad2e" stroke-width="20"/><ellipse cx="1090" cy="640" rx="130" ry="120" fill="url(#fire)" opacity=".7"/>
