<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe7ee"/><stop offset="1" stop-color="#b8c9d4"/></linearGradient>
 <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a6d58"/><stop offset="1" stop-color="#4c3a31"/></linearGradient>
 <linearGradient id="sofa" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#234f70"/><stop offset="1" stop-color="#102e49"/></linearGradient>
 <linearGradient id="stove" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#394957"/><stop offset="1" stop-color="#151e27"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".25"/></filter>
 <radialGradient id="fire"><stop stop-color="#fff"/><stop offset=".25" stop-color="#ffd45a"/><stop offset="1" stop-color="#ff3d22" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/><path d="M0 590L1600 510V900H0Z" fill="url(#floor)"/>
<path d="M0 0H1600V120H0Z" fill="#d5e1e8"/>
