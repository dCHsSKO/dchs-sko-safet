<!-- subtle labels --> <g font-family="Arial" font-weight="700" fill="#fff" opacity=".75"><text x="275" y="510" font-size="24">ОКНО</text><text x="650" y="570" font-size="20">РОЗЕТКА</text><text x="980" y="755" font-size="20">СВЕЧА</text><text x="1390" y="790" font-size="20">ВЫХОД</text></g>
</svg>
